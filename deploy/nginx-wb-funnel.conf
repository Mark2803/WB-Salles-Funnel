# Кусок настройки nginx: открывает инструмент по адресу https://tea-master-team.ru/wb-funnel/
# Вставляется внутрь блока server { ... } для https (listen 443) сайта tea-master-team.ru.
# На хостинг-панели (HestiaCP) — файл /home/ivanc1539/conf/web/tea-master-team.ru/nginx.ssl.conf_wb-funnel
# После изменения: nginx -t && systemctl reload nginx

location = /wb-funnel {
    return 301 /wb-funnel/;
}

location /wb-funnel/ {
    # Слэш в конце proxy_pass убирает префикс /wb-funnel/ — приложение работает от корня
    proxy_pass http://127.0.0.1:3200/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
