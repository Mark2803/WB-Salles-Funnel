# «WB Воронка»: https://tea-master-team.ru/management/wb-funnel/
# Файл кладётся в /home/ivanc1539/conf/web/tea-master-team.ru/nginx.ssl.conf_wb-funnel
# ^~ с более длинным адресом выигрывает у общего /management/ («Менеджмент») независимо от порядка файлов.
# После изменения: nginx -t && systemctl reload nginx

location = /management/wb-funnel {
    return 301 /management/wb-funnel/;
}

location ^~ /management/wb-funnel/ {
    # Слэш в конце proxy_pass убирает префикс — приложение работает от корня
    proxy_pass http://127.0.0.1:3300/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
